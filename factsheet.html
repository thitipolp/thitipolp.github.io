<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticker Redirect</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <h1>Enter Stock Ticker <a href="/counter.html"><button>counter</button></a></h1>
  <!-- Form for the factsheet URL -->
    <legend><strong>SET Tools</strong></legend>
  <fieldset class="panphol-group" style="background-color:#FFD580;max-width:500px">

    <form id="factsheetForm" action="" method="get">

      <input type="text" id="factsheetTicker" name="factsheetTicker" required autofocus>
      <button type="submit">Factsheet</button>

    <br>
    <!-- Form for the news URL -->
    <form id="profileForm" action="" method="get">
      <label for="profileTicker">Ticker:</label>
      <input type="text" id="profileTicker" name="profileTicker" required>
      <button type="submit">SET News</button>
    </form>
  </fieldset>
  <br>
  <fieldset class="panphol-group" style="max-width:500px">
    <!-- Form for Jitta factsheet URL -->
    <form id="jittaForm" action="" method="get">
      <label for="jittaTicker">Ticker:</label>
      <input type="text" id="jittaTicker" name="jittaTicker" required>
      <button type="submit">Jitta Factsheet</button>
    </form>

    <br>
    <!-- Form for Gapfocus URL -->
    <form id="gapfocusForm" action="" method="get">
      <label for="gapfocusTicker">Ticker:</label>
      <input type="text" id="gapfocusTicker" name="gapfocusTicker" required>
      <button type="submit">Gapfocus News</button>
    </form>
  </fieldset>
  <br>
      <legend><strong>AIO Tools</strong></legend>
  <fieldset class="panphol-group" style="background-color:cyan;max-width:500px">


    <!-- Form for Shareholder URL -->
    <form id="shareholderForm" action="" method="get">
      <label for="shareholderTicker">Ticker:</label>
      <input type="text" id="shareholderTicker" name="shareholderTicker" required>
      <button type="submit">Shareholders</button>
    </form>
    <br>

    <!-- Form for SO News URL -->
    <form id="sonewsForm" action="" method="get">
      <label for="sonewsTicker">Ticker:</label>
      <input type="text" id="sonewsTicker" name="sonewsTicker" required>
      <button type="submit">SO News</button>
    </form>
  </fieldset>
    <br>
        <br>
  <fieldset class="panphol-group" style="background-color:#E6F3FF;max-width:500px">
    <legend><strong>Thai Government Tools</strong></legend>
    <!-- Form for Company Tax ID -->
    <form id="taxIdForm" action="" method="get">
      <label for="companyTaxId">Company Tax ID:</label>
      <input type="text" id="companyTaxId" name="companyTaxId" required>
      <button type="submit">DBD Company Profile</button>
    </form>
  </fieldset>
    <br>
        <br>

  <!-- ===== BAHTTEXT converter (live, no button needed) ===== -->
  <fieldset class="panphol-group" style="background-color:#E8F5E9;max-width:500px">
    <legend><strong>BahtText</strong></legend>
    <form id="bahtTextForm" action="" method="get">
      <label for="bahtAmount">Amount:</label>
      <input type="text" id="bahtAmount" name="bahtAmount" inputmode="decimal"
             placeholder="1234.56" autocomplete="off" style="width:180px">
      <button type="submit">Copy</button>
      <div id="bahtAmountFormatted" style="margin-top:6px;color:#555;font-size:0.9em"></div>
      <div id="bahtTextOutput"
           style="margin-top:4px;padding:6px;min-height:1.4em;background:#fff;border:1px solid #bbb;cursor:pointer"
           title="Click to copy"></div>
    </form>
  </fieldset>
  <br>
        <br>
  <fieldset class="panphol-group" style="max-width:500px">

  <form id="masterForm" action="" method="get">
    <label for="masterTicker">Ticker:</label>
    <input type="text" id="masterTicker" name="masterTicker" required>
    <button type="submit">APPLY TO ALL</button>
  </form>
    </fieldset>


<br>
  <hr><br>

  <script>
    // Function to open the factsheet URL
    document.getElementById('factsheetForm').onsubmit = function(event) {
      event.preventDefault(); // Prevent the form from submitting the traditional way
      var ticker = document.getElementById('factsheetTicker').value;
      var baseURL = 'https://www.set.or.th/th/market/product/stock/quote/';
      var endURL = '/factsheet';
      var completeURL = baseURL + ticker + endURL;
      window.open(completeURL, '_blank'); // Open the URL in a new tab
    };

    // Function to open the news URL
    document.getElementById('profileForm').onsubmit = function(event) {
      event.preventDefault(); // Prevent the form from submitting the traditional way
      var ticker = document.getElementById('profileTicker').value;
      var baseURL = 'https://www.set.or.th/th/market/product/stock/quote/';
      var endURL = '/news';
      var completeURL = baseURL + ticker + endURL;
      window.open(completeURL, '_blank'); // Open the URL in a new tab
    };

    // Function to open the Jitta factsheet URL
    document.getElementById('jittaForm').onsubmit = function(event) {
      event.preventDefault(); // Prevent the form from submitting the traditional way
      var ticker = document.getElementById('jittaTicker').value;
      var baseURL = 'https://www.jitta.com/stock/bkk:';
      var endURL = '/factsheet';
      var completeURL = baseURL + ticker + endURL;
      window.open(completeURL, '_blank'); // Open the URL in a new tab
    };

    // Function to open the Gapfocus detail URL
    document.getElementById('gapfocusForm').onsubmit = function(event) {
      event.preventDefault(); // Prevent the form from submitting the traditional way
      var ticker = document.getElementById('gapfocusTicker').value;
      var baseURL = 'https://stock.gapfocus.com/detail/';
      var completeURL = baseURL + ticker;
      window.open(completeURL, '_blank'); // Open the URL in a new tab
    };

    // Function to open the Shareholder info URL
    document.getElementById('shareholderForm').onsubmit = function(event) {
      event.preventDefault(); // Prevent traditional form submission
      var ticker = document.getElementById('shareholderTicker').value.toUpperCase(); // ensure uppercase
      var baseURL = 'https://aio.panphol.com/stock/';
      var endURL = '/sholder';
      var completeURL = baseURL + ticker + endURL;
      window.open(completeURL, '_blank'); // Open the URL in a new tab
    };

    // Function to open the SO News URL
    document.getElementById('sonewsForm').onsubmit = function(event) {
      event.preventDefault(); // Prevent traditional form submission
      var ticker = document.getElementById('sonewsTicker').value.toUpperCase(); // normalize input
      var baseURL = 'https://aio.panphol.com/stock/';
      var endURL = '/sonews';
      var completeURL = baseURL + ticker + endURL;
      window.open(completeURL, '_blank'); // Open the URL in a new tab
    };

    // Function to open the Company Tax ID URL
    document.getElementById('taxIdForm').onsubmit = function(event) {
      event.preventDefault(); // Prevent traditional form submission
      var taxId = document.getElementById('companyTaxId').value;
      var baseURL = 'https://datawarehouse.dbd.go.th/company/profile/5';
      var completeURL = baseURL + taxId;
      window.open(completeURL, '_blank'); // Open the URL in a new tab
    };

    // ===== BAHTTEXT =====
    var THAI_DIGITS = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
    var THAI_PLACES = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];

    // Reads a group of up to 6 digits. hasPrefix = something was already read
    // before this group (so a trailing 1 becomes "เอ็ด").
    function readChunk(digits, hasPrefix) {
      var out = '';
      for (var i = 0; i < digits.length; i++) {
        var d = +digits[i];
        var pos = digits.length - i - 1; // 0 = units place
        if (d === 0) continue;
        if (pos === 0) {
          out += (d === 1 && (digits.length > 1 || hasPrefix)) ? 'เอ็ด' : THAI_DIGITS[d];
        } else if (pos === 1) {
          out += (d === 1) ? 'สิบ' : (d === 2) ? 'ยี่สิบ' : THAI_DIGITS[d] + 'สิบ';
        } else {
          out += THAI_DIGITS[d] + THAI_PLACES[pos];
        }
      }
      return out;
    }

    // Reads an arbitrarily long integer string, splitting on ล้าน every 6 digits.
    function readInteger(str, hasPrefix) {
      str = str.replace(/^0+/, '');
      if (!str) return '';
      if (str.length > 6) {
        var head = str.slice(0, str.length - 6);
        var tail = str.slice(-6);
        return readInteger(head, hasPrefix) + 'ล้าน' + readInteger(tail, true);
      }
      return readChunk(str, hasPrefix);
    }

    function bahtText(value) {
      var cleaned = String(value).replace(/[,\s฿]/g, '');
      if (cleaned === '' || !/^-?\d*\.?\d*$/.test(cleaned) || cleaned === '-' || cleaned === '.') return '';
      var num = parseFloat(cleaned);
      if (isNaN(num)) return '';

      var negative = num < 0;
      var total = Math.round((Math.abs(num) + Number.EPSILON) * 100); // total satang
      var baht = Math.floor(total / 100);
      var satang = total % 100;

      var text;
      if (baht === 0 && satang === 0) {
        text = 'ศูนย์บาทถ้วน';
      } else if (baht === 0) {
        text = readInteger(String(satang), false) + 'สตางค์';
      } else if (satang === 0) {
        text = readInteger(String(baht), false) + 'บาทถ้วน';
      } else {
        text = readInteger(String(baht), false) + 'บาท' + readInteger(String(satang), false) + 'สตางค์';
      }
      return (negative ? 'ลบ' : '') + text;
    }

    (function() {
      var input = document.getElementById('bahtAmount');
      var output = document.getElementById('bahtTextOutput');
      var formatted = document.getElementById('bahtAmountFormatted');

      function render() {
        var cleaned = input.value.replace(/[,\s฿]/g, '');
        var num = parseFloat(cleaned);
        formatted.textContent = isNaN(num) ? '' :
          num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' บาท';
        output.textContent = bahtText(input.value);
      }

      function copy() {
        if (!output.textContent) return;
        navigator.clipboard.writeText(output.textContent).then(function() {
          var previous = output.style.backgroundColor;
          output.style.backgroundColor = '#C8E6C9';
          setTimeout(function() { output.style.backgroundColor = previous || '#fff'; }, 400);
        });
      }

      input.addEventListener('input', render);          // live, no button
      output.addEventListener('click', copy);           // click the result to copy
      document.getElementById('bahtTextForm').onsubmit = function(event) {
        event.preventDefault();
        copy();                                         // Enter also copies
      };
      render();
    })();

    // Master form populates all fields
    document.getElementById('masterForm').onsubmit = function(event) {
      event.preventDefault();
      const ticker = document.getElementById('masterTicker').value.trim().toUpperCase();

      // Set values of all other input fields
      document.getElementById('factsheetTicker').value = ticker;
      document.getElementById('profileTicker').value = ticker;
      document.getElementById('jittaTicker').value = ticker;
      document.getElementById('gapfocusTicker').value = ticker;
      document.getElementById('shareholderTicker').value = ticker;
      document.getElementById('sonewsTicker').value = ticker;
      document.getElementById('companyTaxId').value = ticker;
    };
  </script>

</body>

</html>
